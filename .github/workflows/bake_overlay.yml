name: Bake Overlay data

on:
  schedule:
    - cron: "15 2 * * *"   # daily 02:15 UTC, 10 min after baseline bake
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bake_overlay
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install --no-cache-dir "pandas>=1.4" numpy yfinance requests

      - name: Bake overlay data → overlay_data.json
        run: python bake_overlay_standalone.py

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add overlay_data.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "auto: bake overlay $(date -u +%F)"
            git push
          fi
