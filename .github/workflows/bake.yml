name: Bake BTC history

on:
  schedule:
    - cron: "5 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install --no-cache-dir pandas numpy yfinance

      - name: Bake yfinance history → historic_data.json
        run: python bake_history_standalone.py

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historic_data.json
          if git diff --staged --quiet; then
            echo "No data change."
          else
            git commit -m "auto: bake $(date -u +%F)"
            git push
          fi
